<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COREV MENU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="wash"></div>

  <div class="head">
    <small>MENU</small>
    <b>VEHICLE</b>
  </div>

  <div class="panel" id="panel">
    <div class="title" id="vname">VEHICLE</div>
    <div class="groups" id="groups"></div>
  </div>

  <div class="hints">
    <span class="hint">
      <i class="cap"><svg viewBox="0 0 16 16"><path d="M8 2l2.200 3H5.800zM8 14l2.200-3H5.800zM2 8l3-2.200v4.400zM14 8l-3-2.200v4.400z"/></svg></i>MOVE
    </span>
    <span class="sep"></span>
    <span class="hint">
      <i class="cap"><svg class="line" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"><path d="M12.500 4v5H4.500M7 6.500L4.500 9 7 11.500"/></svg></i>SELECT
    </span>
    <span class="sep"></span>
    <span class="hint"><i class="cap esc">ESC</i>BACK</span>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
